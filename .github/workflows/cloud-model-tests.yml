name: Cloud model regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'homeassistant==2024.4.1' 'pytest>=8,<9'
      - run: python -m pytest -q tests
      - run: python -m compileall -q custom_components/midea_auto_cloud
